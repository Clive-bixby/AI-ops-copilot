name: opspilot

# Local development stack. Every value can be overridden from a root .env file
# (see .env.example); the defaults are for local use only and are not secrets.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    ports:
      # Host port is overridable so this stack can coexist with another local
      # Postgres (POSTGRES_PORT=55432 docker compose up).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot migration job. The API only starts once this exits successfully,
  # so a fresh volume is always migrated before any request is served.
  migrate:
    build:
      context: ./apps/api
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@db:5432/${POSTGRES_DB:-aiops}
      # The bundled Postgres does not terminate TLS.
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@db:5432/${POSTGRES_DB:-aiops}
      # The bundled Postgres does not terminate TLS.
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      # No default: the API refuses to start in production with a missing or
      # placeholder signing key, because a known key lets anyone mint a token for
      # any user. Generate one with `openssl rand -hex 32`.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set; generate one with: openssl rand -hex 32}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Overridable so a gateway or proxy can sit in front of Gemini.
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      # Browser origin allowed to call this API (the web container).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      # Set when a proxy or platform router sits in front of the API, so rate
      # limits key on the real client IP instead of the proxy address.
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      # /ai/test-* routes stay dark unless this is true.
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
      # Ollama runs on the host, not in this stack. Set EMBEDDING_PROVIDER to
      # openai-compatible or fixture to use a hosted API or recorded vectors.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      EMBEDDING_FIXTURE_PATH: ${EMBEDDING_FIXTURE_PATH:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ingestion consumer. Separate process and service so a slow embedding run
  # cannot starve the API event loop. Shares the uploads volume because the
  # document it parses was received by the API container.
  worker:
    build:
      context: ./apps/api
    # Invoked directly, not through `npm run worker`, so SIGTERM reaches the
    # worker process and its in-flight job is allowed to finish on a deploy.
    command: ["node", "--import", "tsx", "src/workers/ingestion.worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@db:5432/${POSTGRES_DB:-aiops}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The worker embeds; it must use the same provider and model as the API or
      # the stored vectors will not match the query vectors.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      EMBEDDING_FIXTURE_PATH: ${EMBEDDING_FIXTURE_PATH:-}
      # Ollama runs on the host, not in this stack.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
    # The image healthcheck probes the HTTP API; this process serves no port.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the bundle at build time; must be reachable from the browser.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
