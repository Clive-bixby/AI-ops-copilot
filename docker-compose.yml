version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://aiops:aiops@db:5432/aiops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me
    depends_on:
      - db
      - redis
  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
